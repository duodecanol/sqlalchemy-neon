name: Protected integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  integration:
    # Never expose the protected environment to fork-triggered workflows.
    if: >-
      github.repository == 'duodecanol/sqlalchemy-neon' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    name: Disposable Neon integration
    runs-on: ubuntu-latest
    environment: neon-integration
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Run protected integration tests
        env:
          # The protected environment must point at a disposable Neon branch/database.
          NEON_TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
          NEON_TEST_ALLOWED_DATABASES: ${{ secrets.NEON_TEST_ALLOWED_DATABASES }}
          NEON_TEST_ALLOW_DESTRUCTIVE: "1"
          ENABLE_TEST_TELEMETRY: "0"
          LOGFIRE_TOKEN: ""
        run: >-
          uv run --group dev --extra telemetry pytest tests/integration -v
