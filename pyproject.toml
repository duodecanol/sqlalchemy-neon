[project]
name = "sqlalchemy-neon"
dynamic = ["version"]
description = "Native async SQLAlchemy execution for Neon over HTTP"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Choe Hwal", email = "41378264+duodecanol@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
]
keywords = ["sqlalchemy", "neon", "postgresql", "serverless", "http", "async"]


dependencies = [
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "psycopg>=3.2.5",
    "aiohttp>=3.11",
]
[project.urls]
Repository = "https://github.com/duodecanol/sqlalchemy-neon"
Issues = "https://github.com/duodecanol/sqlalchemy-neon/issues"
Documentation = "https://github.com/duodecanol/sqlalchemy-neon#readme"

[project.optional-dependencies]
telemetry = [
    "logfire[aiohttp-client,psycopg,asyncpg,sqlalchemy]>=4.22.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "responses>=0.25",
    "asyncpg>=0.30.0",
    "geventhttpclient>=2.3.7",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
    "ruff>=0.15.21",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sqlalchemy_neon/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlalchemy_neon"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/testsupport",
    "/README.md",
    "/TESTING.md",
    "/LICENSE",
    "/pyproject.toml",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
testpaths = ["tests"]
markers = [
    "synctest  : Sync Integration Test",
    "testasync : Async Test",

]

[tool.mypy]
mypy_path = ["src", "."]
explicit_package_bases = true
files = ["src", "tests", "testsupport"]
